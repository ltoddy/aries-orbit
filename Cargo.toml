[package]
name = "aries-orbit"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.7.3" }
agent-client-protocol = { version = "3.4", features = ["process"] }
anyhow = "1"
async-channel = "2"
base64 = "0.22"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
